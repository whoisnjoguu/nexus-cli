# goreleaser configuration for nexus-cli.
# Build snapshots locally with: goreleaser release --snapshot --clean
version: 2

# Default optional env vars so templates referencing them don't error when unset.
env:
  - HOMEBREW_TAP_TOKEN={{ if index .Env "HOMEBREW_TAP_TOKEN" }}{{ .Env.HOMEBREW_TAP_TOKEN }}{{ end }}

before:
  hooks:
    - go mod tidy

builds:
  - id: nexus-cli
    main: .
    binary: nexus-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

# Multi-arch sidecar image on GHCR, built from the linux binaries above (see Dockerfile).
dockers_v2:
  - id: nexus-cli
    ids: [nexus-cli]
    dockerfile: Dockerfile
    images:
      - "ghcr.io/whoisnjoguu/nexus-cli"
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Zero-trust security sidecar, identity broker, and MCP gateway for autonomous agents"
      "org.opencontainers.image.source": "https://github.com/whoisnjoguu/nexus-cli"
      "org.opencontainers.image.licenses": "MIT"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
    annotations:
      "{{ if not .IsSnapshot }}index,{{ end }}manifest:org.opencontainers.image.description": "Zero-trust security sidecar, identity broker, and MCP gateway for autonomous agents"
      "{{ if not .IsSnapshot }}index,{{ end }}manifest:org.opencontainers.image.source": "https://github.com/whoisnjoguu/nexus-cli"
      "{{ if not .IsSnapshot }}index,{{ end }}manifest:org.opencontainers.image.licenses": "MIT"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: nexus-cli
    repository:
      owner: whoisnjoguu
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Skip the tap push unless a PAT for the tap repo is provided.
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"
    homepage: "https://github.com/whoisnjoguu/nexus-cli"
    description: "Zero-trust security sidecar, identity broker, and MCP gateway for autonomous agents"
    license: "MIT"
    test: |
      system "#{bin}/nexus-cli", "--help"
