[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-agent-sdk"
version = "0.1.0"
description = "Gate AI agent tool calls through nexus-cli's least-privilege policy, identity, and audit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alan N" }]
keywords = ["ai", "agents", "security", "zero-trust", "mcp", "guardrails"]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
dev = ["pytest>=7", "httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/whoisnjoguu/nexus-cli"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]
