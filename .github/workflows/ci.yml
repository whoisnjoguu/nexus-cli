name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        shell: bash
        run: go test -race -coverprofile=coverage.out ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build image
        run: make docker IMAGE=nexus-cli:ci
      - name: Smoke test
        run: |
          docker run --rm nexus-cli:ci version
          docker run -d --name nexus --read-only -p 127.0.0.1:8075:8075 nexus-cli:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8075/_nexus/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8075/_nexus/health | grep -q '"status":"ok"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -x http://127.0.0.1:8075 http://example.com/)
          test "$code" = 401
          docker exec nexus nexus-cli audit verify
          docker logs nexus
          docker rm -f nexus

  python-sdk:
    name: Python SDK (${{ matrix.python }}, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python with the stdlib-only core (httpx/requests tests skip).
          - python: "3.9"
            extras: core
            install: pip install -e . "pytest>=7"
          - python: "3.12"
            extras: all
            install: pip install -e ".[dev,all]"
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: ${{ matrix.install }}
      - name: Test
        run: pytest -q -rs
